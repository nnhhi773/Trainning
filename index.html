<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Đào Tạo & Tài Liệu Trực Tuyến</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-5 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Hệ Thống Đào Tạo Nội Bộ</h1>
                <p class="text-indigo-200 text-xs mt-1">Tự động đồng bộ bài giảng & tài liệu</p>
            </div>
            <button onclick="loadCourses()" class="bg-indigo-600 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-sm transition">
                <i class="fa-solid fa-arrows-rotate mr-1"></i> Làm mới
            </button>
        </div>
    </header>

    <!-- Danh sách khóa học -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="loading" class="text-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-600"></i>
            <p class="mt-4 text-gray-600 font-medium">Đang tải danh sách khóa học...</p>
        </div>

        <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Tự động sinh khóa học ở đây -->
        </div>
    </main>

    <!-- Popup xem danh sách tài liệu của khóa học -->
    <div id="modal-list" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-xl w-full p-6 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b">
                <h3 id="modal-course-title" class="text-lg font-bold text-gray-800">Tên Khóa Học</h3>
                <button onclick="closeListModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="modal-files" class="space-y-3 overflow-y-auto my-4 flex-1 pr-1"></div>

            <div class="pt-3 border-t text-right">
                <button onclick="closeListModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition text-sm">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Khung xem tài liệu trực tiếp trên web (Giấu hoàn toàn link Drive) -->
    <div id="modal-viewer" class="fixed inset-0 bg-black/80 hidden z-50 flex flex-col p-2 md:p-6">
        <div class="bg-gray-900 text-white px-4 py-2 rounded-t-lg flex justify-between items-center">
            <span id="viewer-filename" class="text-sm font-medium truncate">Đang xem tài liệu</span>
            <button onclick="closeViewer()" class="text-white hover:text-red-400 text-2xl font-bold">&times;</button>
        </div>
        <div class="flex-1 bg-white rounded-b-lg overflow-hidden relative">
            <iframe id="viewer-frame" class="w-full h-full border-0" src=""></iframe>
        </div>
    </div>

    <script>
        // DÁN ĐƯỜNG LINK WEB APP BƯỚC 2 VÀO ĐÂY:
        const API_URL = "DÁN_LINK_WEB_APP_Ở_BƯỚC_2_VÀO_ĐÂY";

        let allCourses = [];

        async function loadCourses() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('course-grid').classList.add('hidden');

            try {
                const res = await fetch(API_URL);
                const result = await res.json();
                
                if (result.status === "success") {
                    allCourses = result.data;
                    renderCourses();
                } else {
                    alert("Lỗi: " + result.message);
                }
            } catch (e) {
                alert("Không thể kết nối máy chủ dữ liệu!");
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('course-grid').classList.remove('hidden');
            }
        }

        function renderCourses() {
            const grid = document.getElementById('course-grid');
            if (allCourses.length === 0) {
                grid.innerHTML = `<p class="col-span-3 text-center text-gray-500 py-10">Chưa có khóa học nào. Hãy tạo thư mục trong Google Drive!</p>`;
                return;
            }

            grid.innerHTML = allCourses.map(course => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition p-5 flex flex-col justify-between">
                    <div>
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center text-xl mb-4">
                            <i class="fa-solid fa-graduation-cap"></i>
                        </div>
                        <h3 class="font-bold text-lg text-gray-800 line-clamp-2">${course.title}</h3>
                        <p class="text-gray-500 text-xs mt-2">${course.files.length} tài liệu đính kèm</p>
                    </div>
                    <button onclick="openListModal('${course.id}')" class="mt-5 w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition">
                        Vào học & Tải tài liệu
                    </button>
                </div>
            `).join('');
        }

        function openListModal(courseId) {
            const course = allCourses.find(c => c.id === courseId);
            if (!course) return;

            document.getElementById('modal-course-title').innerText = course.title;
            const fileList = document.getElementById('modal-files');

            if (course.files.length === 0) {
                fileList.innerHTML = `<p class="text-gray-400 text-sm text-center py-4">Khóa học này chưa có file nào.</p>`;
            } else {
                fileList.innerHTML = course.files.map(file => `
                    <div class="flex items-center justify-between p-3 bg-gray-50 border rounded-lg hover:bg-indigo-50/50 transition">
                        <div class="flex items-center space-x-3 overflow-hidden mr-2">
                            <i class="fa-solid fa-file-pdf text-red-500 text-lg"></i>
                            <div>
                                <p class="text-sm font-medium text-gray-800 truncate">${file.name}</p>
                                <span class="text-xs text-gray-400">${file.size}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 flex-shrink-0">
                            <!-- Nút Xem: Mở ngay trên web không lộ link -->
                            <button onclick="openViewer('${file.previewUrl}', '${file.name}')" class="px-2.5 py-1 bg-white border border-gray-300 text-gray-700 rounded text-xs font-semibold hover:bg-gray-100">
                                Xem
                            </button>
                            <!-- Nút Tải: Tải thẳng về máy -->
                            <a href="${file.downloadUrl}" class="px-2.5 py-1 bg-indigo-600 text-white rounded text-xs font-semibold hover:bg-indigo-700">
                                Tải
                            </a>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('modal-list').classList.remove('hidden');
        }

        function closeListModal() {
            document.getElementById('modal-list').classList.add('hidden');
        }

        function openViewer(previewUrl, filename) {
            document.getElementById('viewer-filename').innerText = filename;
            document.getElementById('viewer-frame').src = previewUrl;
            document.getElementById('modal-viewer').classList.remove('hidden');
        }

        function closeViewer() {
            document.getElementById('viewer-frame').src = "";
            document.getElementById('modal-viewer').classList.add('hidden');
        }

        // Tự động tải danh sách khi mở web
        loadCourses();
    </script>
</body>
</html>
