<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Đào Tạo & Tài Liệu Khóa Học</title>
    <!-- Sử dụng Tailwind CSS qua CDN để web đẹp mà không cần cài đặt phức tạp -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Thanh tiêu đề (Header) -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Cổng Học Tập & Đào Tạo</h1>
                <p class="text-blue-100 text-sm mt-1">Nơi lưu trữ bài giảng và tài liệu học tập chính thức</p>
            </div>
            <span class="bg-blue-700 px-3 py-1 rounded-full text-xs font-semibold">R2 Storage Ready</span>
        </div>
    </header>

    <!-- Nội dung chính -->
    <main class="max-w-6xl mx-auto px-4 py-10">
        <div class="mb-8">
            <h2 class="text-xl font-bold text-gray-700">Khóa Học Hiện Có</h2>
            <p class="text-gray-500 text-sm">Chọn khóa học để xem chi tiết và tải tài liệu đính kèm.</p>
        </div>

        <!-- Danh sách khóa học (Dạng Grid) -->
        <div id="course-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dữ liệu sẽ được JavaScript hiển thị tự động vào đây -->
        </div>
    </main>

    <!-- Modal hiển thị danh sách tài liệu khi bấm vào khóa học -->
    <div id="course-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center pb-4 border-b">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800">Tên Khóa Học</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            
            <p id="modal-desc" class="text-gray-600 text-sm my-3"></p>

            <h4 class="font-semibold text-gray-700 mt-2 mb-3">Danh sách tài liệu học tập:</h4>
            
            <!-- Danh sách tài liệu lấy từ Cloudflare R2 -->
            <div id="modal-docs" class="space-y-3 overflow-y-auto flex-1 pr-1">
                <!-- Danh sách tài liệu render qua JS -->
            </div>

            <div class="pt-4 border-t mt-4 text-right">
                <button onclick="closeModal()" class="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Script xử lý dữ liệu và link R2 -->
    <script>
        // BƯỚC THAY THẾ LINK R2:
        // Bạn thay các đường link mẫu bên dưới bằng Public URL bạn vừa copy từ Cloudflare R2
        const courses = [
            {
                id: 1,
                title: "Khóa Học: Kỹ Năng Bán Hàng B2B",
                desc: "Bộ bài giảng và tài liệu chuẩn về quy trình tiếp cận khách hàng doanh nghiệp.",
                image: "https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&q=80",
                documents: [
                    { 
                        name: "Slide Bài 1: Tổng quan phễu bán hàng (PDF)", 
                        type: "pdf",
                        // Link R2 của bạn ở đây:
                        url: "https://pub-xxxxxxxxxxxxxx.r2.dev/bai1-tong-quan.pdf" 
                    },
                    { 
                        name: "Biểu mẫu: Kế hoạch tuần (Excel)", 
                        type: "excel", 
                        url: "https://pub-xxxxxxxxxxxxxx.r2.dev/ke-hoach-tuan.xlsx" 
                    }
                ]
            },
            {
                id: 2,
                title: "Khóa Học: Nhập Môn Digital Marketing",
                desc: "Tài liệu đào tạo nội bộ về Facebook Ads, Google Ads và SEO căn bản.",
                image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=500&q=80",
                documents: [
                    { 
                        name: "Tài liệu: Quy chuẩn viết content SEO", 
                        type: "pdf", 
                        url: "https://pub-xxxxxxxxxxxxxx.r2.dev/quy-chuan-content.pdf" 
                    },
                    { 
                        name: "File nén: Trọn bộ ảnh mẫu thiết kế (ZIP)", 
                        type: "zip", 
                        url: "https://pub-xxxxxxxxxxxxxx.r2.dev/anh-mau.zip" 
                    }
                ]
            }
        ];

        // Hàm render danh sách khóa học
        const courseListContainer = document.getElementById('course-list');
        
        function renderCourses() {
            courseListContainer.innerHTML = courses.map(course => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
                    <img src="${course.image}" alt="${course.title}" class="w-full h-44 object-cover">
                    <div class="p-5">
                        <h3 class="font-bold text-lg text-gray-800 line-clamp-1">${course.title}</h3>
                        <p class="text-gray-500 text-sm mt-2 line-clamp-2">${course.desc}</p>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-xs text-blue-600 font-medium bg-blue-50 px-2 py-1 rounded">
                                ${course.documents.length} tài liệu
                            </span>
                            <button onclick="openCourse(${course.id})" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition">
                                Xem tài liệu
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Hàm mở popup xem tài liệu
        function openCourse(courseId) {
            const course = courses.find(c => c.id === courseId);
            if (!course) return;

            document.getElementById('modal-title').innerText = course.title;
            document.getElementById('modal-desc').innerText = course.desc;

            const docsContainer = document.getElementById('modal-docs');
            docsContainer.innerHTML = course.documents.map(doc => `
                <div class="flex items-center justify-between p-3 bg-gray-50 border border-gray-200 rounded-lg">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-file text-blue-500 text-lg"></i>
                        <span class="text-sm font-medium text-gray-700">${doc.name}</span>
                    </div>
                    <div class="space-x-2">
                        <!-- Mở xem trực tiếp trên tab mới -->
                        <a href="${doc.url}" target="_blank" class="px-3 py-1 bg-white border border-gray-300 text-xs font-semibold rounded hover:bg-gray-100 text-gray-700 transition">
                            Mở xem
                        </a>
                        <!-- Bắt buộc trình duyệt tải về -->
                        <a href="${doc.url}" download class="px-3 py-1 bg-blue-600 text-xs font-semibold rounded hover:bg-blue-700 text-white transition">
                            Tải xuống
                        </a>
                    </div>
                </div>
            `).join('');

            document.getElementById('course-modal').classList.remove('hidden');
        }

        // Đóng popup
        function closeModal() {
            document.getElementById('course-modal').classList.add('hidden');
        }

        // Chạy khởi tạo
        renderCourses();
    </script>
</body>
</html>
